name: smart_notes_ai
description: "NoteFlow — AI-powered smart note-taking application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.3.0
  provider: ^6.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^7.2.0
  google_generative_ai: ^0.4.6
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  screenshot: ^3.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  image_picker: ^1.2.1
  file_picker: ^11.0.2
  syncfusion_flutter_pdf: ^33.2.3
  html: ^0.15.6
  archive: ^4.0.9
  package_info_plus: ^8.0.0
  google_mobile_ads: ^8.0.0
  flutter_native_splash: ^2.4.7
  flutter_quill: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
flutter_native_splash:
  color: "#FCF8FF"
  image: assets/images/ic_launcher.png
  android: true
  ios: true